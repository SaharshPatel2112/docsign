<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    
    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-opacity="0.3" flood-color="#0f172a" />
    </filter>
    <filter id="lightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.15" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- App Icon Rounded Square -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Document Base -->
  <path d="M 72 56 
           H 148 
           L 184 92 
           V 192 
           C 184 196.4 180.4 200 176 200 
           H 80 
           C 75.6 200 72 196.4 72 192 
           Z" 
        fill="url(#docGrad)" filter="url(#lightShadow)" />
  
  <!-- Document Folded Corner -->
  <path d="M 148 56 V 84 C 148 88.4 151.6 92 156 92 H 184 Z" fill="#e2e8f0" />

  <!-- Document Text Lines -->
  <rect x="96" y="104" width="64" height="6" rx="3" fill="#cbd5e1" />
  <rect x="96" y="128" width="48" height="6" rx="3" fill="#cbd5e1" />

  <!-- Dotted Signature Line -->
  <line x1="96" y1="176" x2="160" y2="176" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" />

  <!-- Blue Cursive Signature -->
  <path d="M 98 168 C 112 140, 116 178, 128 158 C 138 144, 140 178, 156 162" 
        fill="none" 
        stroke="#2563eb" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Stylized Fountain Pen Nib -->
  <!-- Positioned right at the end of the signature curve -->
  <g transform="translate(156, 162)">
    <!-- Gold Nib Body -->
    <path d="M 0 0 L 8 -24 C 16 -28, 28 -16, 24 -8 Z" fill="#fbbf24" filter="url(#lightShadow)" />
    <!-- Nib Center Split -->
    <line x1="0" y1="0" x2="13" y2="-13" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
    <!-- Nib Breathing Hole -->
    <circle cx="13" cy="-13" r="2.5" fill="#b45309" />
  </g>
</svg>
